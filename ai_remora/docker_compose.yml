version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: remora
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/remora
      LITELLM_ENDPOINT: http://host.docker.internal:4000/v1/chat/completions
      LITELLM_MASTER_KEY: sk-master-1234
      LITELLM_MODEL: gpt-4-0613
      LITELLM_MAX_TOKENS: "2048"
      LITELLM_TEMPERATURE: "0.7"
      LITELLM_TOP_P: "1.0"
      LITELLM_FREQUENCY_PENALTY: "0.0"
      LITELLM_PRESENCE_PENALTY: "0.0"
      LITELLM_STOP: "\n\n"
      LITELLM_STREAM: "true"
      LITELLM_LOG_LEVEL: "info"
      LITELLM_LOG_DIR: "/logs"
      LITELLM_LOG_FILE: "remora.log"
      LITELLM_LOG_MAX_SIZE: "10MB"
      LITELLM_LOG_BACKUP_COUNT: "5"
      LITELLM_LOG_RETENTION_DAYS: "7"
      LITELLM_LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      LITELLM_LOG_DATE_FORMAT: "%Y-%m-%d %H:%M:%S"
      LITELLM_LOG_LEVELS: "DEBUG,INFO,WARNING,ERROR,CRITICAL"
      LITELLM_LOG_COLORS: "DEBUG=blue,INFO=green,WARNING=yellow,ERROR=red,CRITICAL=magenta"
      LITELLM_LOG_ENABLE_CONSOLE: "true"
      LITELLM_LOG_ENABLE_FILE: "true"
      LITELLM_LOG_ENABLE_ROTATION: "true"
      LITELLM_LOG_ENABLE_RETENTION: "true"
      LITELLM_LOG_ENABLE_COLOR: "true"
      LITELLM_LOG_ENABLE_LEVELS: "true"
      LITELLM_LOG_ENABLE_DATE: "true"
      LITELLM_LOG_ENABLE_NAME: "true"
      LITELLM_LOG_ENABLE_THREAD: "false"
      LITELLM_LOG_ENABLE_PROCESS: "false"
      LITELLM_LOG_ENABLE_EXCEPTION: "false"
      LITELLM_LOG_ENABLE_STACKTRACE: "false"
      LITELLM_LOG_ENABLE_TRACE: "false"
      LITELLM_LOG_ENABLE_DEBUG: "false"
      LITELLM_LOG_ENABLE_INFO: "true"
      LITELLM_LOG_ENABLE_WARNING: "true"
      LITELLM_LOG_ENABLE_ERROR: "true"
      LITELLM_LOG_ENABLE_CRITICAL: "true"
      LITELLM_LOG_ENABLE_ALL: "false"
      LITELLM_LOG_DISABLE_ALL: "false"
      LITELLM_LOG_ENABLE_JSON: "false"
      LITELLM_LOG_ENABLE_STRUCTURED: "false"
      LITELLM_LOG_ENABLE_CONTEXT: "false"
      LITELLM_LOG_ENABLE_METADATA: "false"
      LITELLM_LOG_ENABLE_TRACEBACK: "false"
      LITELLM_LOG_ENABLE_EXCEPTION_INFO: "false"
      LITELLM_LOG_ENABLE_STACK_INFO: "false"
      LITELLM_LOG_ENABLE_PROCESS_INFO: "false"
      LITELLM_LOG_ENABLE_THREAD_INFO: "false"
      LITELLM_LOG_ENABLE_CUSTOM: "false"

