name: CI

on:
  push:
    branches: [ main, master, Remora-Adriel-M ]
  pull_request:
    branches: [ main, master, Remora-Adriel-M ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    - name: Run tests
      run: |
        cd backend
        python -m pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: |
        cd client
        npm install
    - name: Run lint
      run: |
        cd client
        npm run lint
    - name: Build
      run: |
        cd client
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker images
      run: |
        docker build -t remora-backend ./backend
        docker build -t remora-frontend ./client