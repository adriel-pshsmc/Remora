version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: remora
      POSTGRES_USER: remora
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  tendermint:
    image: tendermint/tendermint:v0.34.24
    ports:
      - "26656:26656"
      - "26657:26657"
    volumes:
      - tendermint_data:/tendermint
    command: node --proxy_app=tcp://bigchaindb:26658

  bigchaindb:
    build: .
    environment:
      BIGCHAINDB_DATABASE_BACKEND: localmongodb
      BIGCHAINDB_DATABASE_HOST: mongodb
      BIGCHAINDB_DATABASE_PORT: 27017
      BIGCHAINDB_DATABASE_NAME: bigchain
      BIGCHAINDB_SERVER_BIND: 0.0.0.0:9984
      BIGCHAINDB_WSSERVER_HOST: 0.0.0.0
      BIGCHAINDB_WSSERVER_PORT: 9985
    ports:
      - "9984:9984"
      - "9985:9985"
      - "26658:26658"
    depends_on:
      - mongodb
      - tendermint
    volumes:
      - ./bigchaindb:/app

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://remora:password@postgres/remora
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - bigchaindb
    volumes:
      - ./backend:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  mongodb_data:
  tendermint_data: